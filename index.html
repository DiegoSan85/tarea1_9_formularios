<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
        <!-- form: agrupa los campos de un formulario y los envía todos juntos al pulsar un botón de envío -->
    <!-- action: la página a la que se mandan los datos; method: cómo se mandan (con get van en la URL) -->
    <form action="index.html" method="get">

        <!-- fieldset: agrupa campos que tienen que ver entre sí y les dibuja un borde alrededor -->
        <fieldset>
            <!-- legend: el título del grupo de campos, que aparece encima del borde del fieldset -->
            <legend>Datos personales by Diego</legend>
                        <p>
                <!-- label: el texto que explica qué hay que poner en un campo; al pulsarlo se activa el campo -->
                <!-- for: une el label con su campo, poniendo el mismo valor que el id del campo -->
                <label for="nombre">Nombre:</label>
                <!-- input: crea un campo donde el usuario escribe o elige algo -->
                <!-- type: dice qué clase de campo es; text: un campo de texto normal de una línea -->
                <!-- id: un nombre único para el campo dentro de la página, lo usa el label para encontrarlo -->
                <!-- name: el nombre con el que se envía el dato; en la URL sale como name=valor -->
                <!-- placeholder: un texto de ejemplo en gris que desaparece al escribir -->
                <!-- required: no deja enviar el formulario si el campo está vacío -->
                <!-- autofocus: pone el cursor en este campo nada más abrir la página -->
                <!-- size: el ancho del campo, medido en caracteres -->
                <!-- maxlength: el número máximo de caracteres que se pueden escribir -->
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">
            </p>

            <p>
                <!-- password: un campo de texto que oculta lo que escribes con puntos -->
                <!-- minlength: el número mínimo de caracteres que hay que escribir -->
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" minlength="8">
            </p>

            <p>
                <!-- email: un campo para correos; comprueba que tenga forma de correo, con @ -->
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
            </p>

            <p>
                <!-- tel: un campo para números de teléfono; en el móvil abre el teclado numérico -->
                <!-- pattern: una regla que tiene que cumplir lo escrito; [0-9]{9} significa 9 cifras seguidas -->
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
            </p>

        </fieldset>

    </form>
    
</body>
</html>
