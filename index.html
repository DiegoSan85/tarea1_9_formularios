<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.9 - Formularios HTML</title>
</head>
<body>
        <!-- form: agrupa los campos de un formulario y los envía todos juntos al pulsar un botón de envío -->
    <!-- action: la página a la que se mandan los datos; method: cómo se mandan (con get van en la URL) -->
    <form action="index.html" method="get">

        <!-- fieldset: agrupa campos que tienen que ver entre sí y les dibuja un borde alrededor -->
        <fieldset>
            <!-- legend: el título del grupo de campos, que aparece encima del borde del fieldset -->
            <legend>Datos personales by Diego</legend>
                        <p>
                <!-- label: el texto que explica qué hay que poner en un campo; al pulsarlo se activa el campo -->
                <!-- for: une el label con su campo, poniendo el mismo valor que el id del campo -->
                <label for="nombre">Nombre:</label>
                <!-- input: crea un campo donde el usuario escribe o elige algo -->
                <!-- type: dice qué clase de campo es; text: un campo de texto normal de una línea -->
                <!-- id: un nombre único para el campo dentro de la página, lo usa el label para encontrarlo -->
                <!-- name: el nombre con el que se envía el dato; en la URL sale como name=valor -->
                <!-- placeholder: un texto de ejemplo en gris que desaparece al escribir -->
                <!-- required: no deja enviar el formulario si el campo está vacío -->
                <!-- autofocus: pone el cursor en este campo nada más abrir la página -->
                <!-- size: el ancho del campo, medido en caracteres -->
                <!-- maxlength: el número máximo de caracteres que se pueden escribir -->
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required autofocus size="30" maxlength="40">
            </p>

            <p>
                <!-- password: un campo de texto que oculta lo que escribes con puntos -->
                <!-- minlength: el número mínimo de caracteres que hay que escribir -->
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" minlength="8">
            </p>

            <p>
                <!-- email: un campo para correos; comprueba que tenga forma de correo, con @ -->
                <label for="correo">Correo:</label>
                <input type="email" id="correo" name="correo" required>
            </p>

            <p>
                <!-- tel: un campo para números de teléfono; en el móvil abre el teclado numérico -->
                <!-- pattern: una regla que tiene que cumplir lo escrito; [0-9]{9} significa 9 cifras seguidas -->
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}">
            </p>
                        <p>
                <!-- date: un campo para elegir una fecha con un calendario -->
                <label for="nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="nacimiento" name="nacimiento">
            </p>

            <p>
                <!-- file: un botón para elegir un archivo del ordenador -->
                <label for="foto">Foto:</label>
                <input type="file" id="foto" name="foto">
            </p>

            <p>
                <!-- value: el valor que tiene el campo; aquí ya viene escrito y es lo que se envía -->
                <!-- readonly: el campo se puede ver y se envía, pero no se puede cambiar -->
                <label for="curso">Curso:</label>
                <input type="text" id="curso" name="curso" value="2026-27" readonly>
            </p>

            <p>
                <!-- disabled: el campo sale desactivado en

        </fieldset>
        
        <fieldset>
            <legend>Preferencias</legend>

            <p>Turno:</p>
            <p>
                <!-- radio: un botón redondo para elegir una sola opción; los que tienen el mismo name forman un grupo -->
                <input type="radio" id="manana" name="turno" value="manana">
                <label for="manana">Mañana</label>
                <input type="radio" id="tarde" name="turno" value="tarde">
                <label for="tarde">Tarde</label>
            </p>

            <p>Intereses:</p>
            <p>
                <!-- checkbox: una casilla que se marca o desmarca; se pueden marcar varias del mismo grupo -->
                <input type="checkbox" id="web" name="intereses" value="web">
                <label for="web">Desarrollo web</label>
                <input type="checkbox" id="videojuegos" name="intereses" value="videojuegos">
                <label for="videojuegos">Videojuegos</label>
                <input type="checkbox" id="redes" name="intereses" value="redes">
                <label for="redes">Redes</label>
            </p>
            
            <p>
                <!-- number: un campo solo para números, con flechas para subir y bajar -->
                <!-- min: el valor más pequeño permitido; max: el valor más grande permitido -->
                <!-- step: de cuánto en cuánto sube o baja el número con las flechas -->
                <label for="horas">Horas de estudio:</label>
                <input type="number" id="horas" name="horas" min="0" max="10" step="2">
            </p>

            <p>
                <!-- range: una barra deslizante para elegir un número entre un mínimo y un máximo -->
                <label for="nivel">Nivel:</label>
                <input type="range" id="nivel" name="nivel" min="1" max="10">
            </p>

            <p>
                <!-- color: abre una paleta para elegir un color -->
                <label for="color">Color favorito:</label>
                <input type="color" id="color" name="color">
            </p>

            <p>
                <!-- time: un campo para elegir una hora y los minutos -->
                <label for="hora">Hora:</label>
                <input type="time" id="hora" name="hora">
            </p>

                   <p>
                <!-- week: un campo para elegir una semana del año -->
                <label for="semana">Semana:</label>
                <input type="week" id="semana" name="semana">
            </p>

            <p>
                <!-- month: un campo para elegir un mes y un año -->
                <label for="mes">Mes:</label>
                <input type="month" id="mes" name="mes">
            </p>

            <p>
                <!-- select: una lista desplegable de opciones para elegir -->
                <!-- multiple: permite elegir varias opciones de la lista a la vez -->
                <label for="modulos">Módulos:</label>
                <select id="modulos" name="modulos" multiple>
                    <!-- optgroup: agrupa varias opciones de la lista bajo un título -->
                    <!-- label (en optgroup): el título del grupo, que se ve en la lista pero no se puede elegir -->
                    <optgroup label="Primer curso">
                        <!-- option: cada una de las opciones que se pueden elegir en la lista -->
                        <!-- selected: deja esa opción ya elegida al abrir la página -->
                        <option value="programacion" selected>Programación</option>
                        <option value="entornos">Entornos de desarrollo</option>
                        <option value="sistemas">Sistemas informáticos</option>
                    </optgroup>
                    <optgroup label="Segundo curso">
                        <option value="cliente">Desarrollo web en entorno cliente</option>
                        <option value="servidor">Desarrollo web en entorno servidor</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <!-- textarea: un cuadro de texto grande para escribir varias líneas -->
                <!-- rows: cuántas líneas de alto tiene el cuadro; cols: cuántos caracteres de ancho -->
                <label for="comentarios">Comentarios:</label>
                <textarea id="comentarios" name="comentarios" rows="5" cols="40"></textarea>
            </p>     
        </fieldset>
        
        <p>
            <!-- submit: un botón que envía el formulario con todos sus datos -->
            <input type="submit" value="Enviar">
            <!-- reset: un botón que borra todo lo escrito y deja el formulario como al principio -->
            <input type="reset" value="Borrar">
            <!-- button: un botón que no hace nada por sí solo; se usa con JavaScript -->
            <input type="button" value="Botón normal">
        </p>

        <p>
            <!-- image: un botón de envío que se ve como una imagen; envía también dónde se ha hecho clic -->
            <!-- src: la ruta de la imagen que se muestra; alt: el texto que sale si la imagen no carga -->
            <input type="image" src="enviar.png" alt="Enviar formulario" name="imagen">
        </p>

        <p>
            <!-- button: crea un botón al que se le puede poner texto o imágenes dentro; su type dice qué hace -->
            <button type="submit">Enviar (button)</button>
            <button type="reset">Borrar (button)</button>
            <button type="button">Botón normal (button)</button>
        </p>
        

    </form>
    
</body>
</html>
